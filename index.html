<style>
:root{--navy:#123e52;--blue:#0d7893;--orange:#ff7134;--yellow:#ffc84a;--ink:#17313e;--muted:#6c7f87;--line:#d8e5e7;--paper:#f5fbfb;--green:#1a9360}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--paper);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--blue),var(--navy));box-shadow:0 7px 18px #0b6f8933;font-size:23px}.brand strong,.brand small{display:block}.brand strong{font-size:18px}.brand small{font-size:10px;color:#799098;letter-spacing:.12em}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,70px);border-bottom:1px solid var(--line);background:#fff}.chip{font-size:13px;color:var(--blue);background:#e7f7f8;border:1px solid #c9ecef;border-radius:999px;padding:8px 14px}
.landing{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 8% 65%,#dff6f6 0 13%,transparent 13.2%),radial-gradient(circle at 92% 25%,#fff0d1 0 12%,transparent 12.2%),var(--paper)}.entry{width:min(1180px,92vw);margin:auto;display:grid;grid-template-columns:1.05fr .8fr;align-items:center;gap:clamp(45px,8vw,110px);padding:50px 0}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.18em;color:var(--orange)}.intro h1{font-size:clamp(45px,6vw,76px);line-height:1.08;letter-spacing:-.05em;margin:16px 0;color:var(--navy)}.intro h1 em{font-style:normal;color:var(--orange)}.intro p{font-size:18px;line-height:1.9;color:#506973}.features{display:flex;gap:10px;flex-wrap:wrap}.features span{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-weight:700;font-size:14px}.card{background:#fff;border:1px solid #d5e4e6;border-radius:27px;padding:22px 28px;box-shadow:0 30px 70px #204d5c1a}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef5f5;border-radius:13px;padding:5px}.tabs button{border:0;background:transparent;border-radius:10px;padding:12px;color:#65777e;font-weight:900}.tabs button.active{background:#fff;color:var(--navy);box-shadow:0 3px 11px #193f4d18}.card-title{margin:25px 0 20px}.card-title h2{margin:0}.card-title p{margin:4px 0;color:var(--muted);font-size:14px}.card label{display:block;font-size:14px;font-weight:800;margin:13px 0}.card input{display:block;width:100%;border:1.5px solid #ccdcdf;border-radius:12px;padding:13px 14px;margin-top:7px;outline:0;background:#fbfdfd}.code-input{font-size:25px!important;font-weight:900;letter-spacing:.24em;text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;border:0;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border-radius:13px;padding:15px;font-weight:900;font-size:16px;margin-top:18px}.primary.orange{background:linear-gradient(135deg,#ff8b46,#ed5e24)}.error{background:#fff0ee;color:#b8392f;border-radius:10px;padding:10px}.privacy{text-align:center;color:#8a9a9f;font-size:12px}.landing footer{text-align:center;color:#789097;font-size:13px;padding:14px}
.teacher{min-height:100vh;background:#f3f8f8}.teacher-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100vh - 76px)}.control{padding:30px clamp(25px,5vw,68px);border-right:1px solid var(--line)}.room-head{display:flex;align-items:center;justify-content:space-between}.room-head span{color:var(--blue);font-size:13px;font-weight:900}.room-head h1{margin:4px 0;font-size:clamp(25px,3vw,36px)}.ghost{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px}.stage{height:clamp(270px,42vh,420px);margin:24px 0 18px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(140deg,#d9f2f4,#eaf8f8);border:1px solid #cbe8eb}.stage .icon{font-size:56px}.stage h2{font-size:clamp(29px,4vw,48px);margin:8px;color:var(--navy)}.stage.winner{background:linear-gradient(140deg,#fff9dc,#ffc84a);border-color:#edb72f}.actions{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}.actions button{border:0;border-radius:14px;padding:15px 10px;font-weight:900}.open{background:var(--orange);color:#fff}.lock{background:var(--navy);color:#fff}.wait{background:#fff;border:1px solid var(--line)!important}.scorebar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}.scorebar button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px}.scorebar .award{background:var(--green);color:#fff}.side{background:#fff;padding:22px;display:flex;flex-direction:column}.join-card{background:linear-gradient(135deg,var(--navy),#116f84);border-radius:19px;color:#fff;padding:17px;display:flex;justify-content:space-between;align-items:center}.join-card span,.join-card strong{display:block}.join-card strong{font-size:36px;letter-spacing:.14em}.join-card button{border:0;background:#ffffff1f;color:#fff;border-radius:8px;padding:7px}.qr{width:104px;height:104px;background:#fff;border-radius:10px;padding:6px}.qr img,.qr canvas{width:100%!important;height:100%!important}.rank-title{margin:22px 0 10px}.rank-title h2{margin:0}.rank-title p{font-size:13px;color:var(--muted)}.ranking{overflow:auto;flex:1}.rank{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;padding:11px 7px;border-bottom:1px solid #edf2f2}.rank>b{width:29px;height:29px;border-radius:9px;background:#edf3f3;display:grid;place-items:center}.rank:first-child>b{background:#ffe9a6}.rank span strong,.rank span small{display:block}.rank span small{font-size:11px;color:#849499}.rank em{font-style:normal;font-weight:900;color:var(--blue)}.mini{grid-column:2/4;display:flex;gap:4px}.mini button{width:28px;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px}.empty{text-align:center;color:#93a3a8;padding:45px}.end{border:0;background:transparent;color:#a55c52;text-decoration:underline;padding:13px}.live{font-size:13px;font-weight:900;border-radius:999px;padding:8px 13px;background:#eaf0f1}.live.open{background:#dff9ea;color:#147345}.live.locked{background:#fff1e8;color:#bd551f}
.student{min-height:100vh;background:radial-gradient(circle at 50% 45%,#e7f6f7,#d9ebee 60%,#cbdde0);display:flex;flex-direction:column}.student.ready{background:radial-gradient(circle at 50% 45%,#fff4d4,#ffe1ab 55%,#ffc981)}.student-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.student-meta{text-align:center}.student-meta span,.student-meta strong,.student-meta small{display:block}.student-meta strong{font-size:clamp(25px,7vw,36px)}.buzzer{border:0;background:transparent;margin:24px 0;width:min(68vw,330px);aspect-ratio:1}.ring{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#315d6d,#0b2935);padding:22px;box-shadow:0 28px 0 #09242f,0 38px 40px #16343e66}.face{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 37% 27%,#93c7d0,#2e7386 50%,#185165);color:#fff;border:5px solid #8fc0c8}.face b{font-size:clamp(38px,10vw,54px)}.face i{font-style:normal;font-size:54px}.face small{letter-spacing:.2em}.buzzer.ready .ring{background:linear-gradient(145deg,#b74417,#702106);box-shadow:0 28px 0 #671e06,0 38px 45px #a83a1f66;animation:pulse 1s infinite alternate}.buzzer.ready .face{background:radial-gradient(circle at 37% 27%,#ffb46c,#ff6930 52%,#d74418)}.buzzer.pressed .ring{transform:translateY(20px);box-shadow:0 8px 0 #671e06}@keyframes pulse{to{filter:brightness(1.08);transform:scale(1.02)}}.message{width:min(92vw,460px);background:#ffffffdc;border:1px solid #ccdcde;border-radius:18px;padding:15px;text-align:center}.message strong{display:block;color:var(--navy)}.message.winner{background:#fff7d3;border-color:#edc446}
.setup{position:fixed;inset:0;background:#092732df;display:grid;place-items:center;z-index:20;padding:20px}.setup-box{width:min(560px,100%);background:#fff;border-radius:22px;padding:27px}.setup-box input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px}.setup-box p{color:var(--muted);line-height:1.7}
.admin{min-height:100vh;background:#f2f7f8}.admin-main{width:min(1180px,94vw);margin:0 auto;padding:28px 0}.admin-nav{display:flex;gap:8px;margin-bottom:20px}.admin-nav button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 16px;font-weight:800}.admin-nav button.active{background:var(--navy);color:#fff}.admin-grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 30px #153f4c0b}.panel h2{margin:0 0 15px}.field{display:block;font-size:13px;font-weight:800;margin:10px 0}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #cbdcdf;border-radius:9px;padding:10px;background:#fbfdfd}.field textarea{min-height:85px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.question-actions{display:flex;gap:8px}.question-actions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800}.secondary{background:#edf4f5;color:var(--navy)}.toolbar{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:13px}.q-list{display:grid;gap:9px;max-height:68vh;overflow:auto}.q-item{border:1px solid var(--line);border-radius:13px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px}.q-item small{color:var(--muted)}.q-item h3{font-size:15px;margin:5px 0}.q-item .answer{color:var(--green);font-size:13px;font-weight:800}.q-item button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#e5f5f6;color:var(--blue);font-size:11px;font-weight:900}.badge.off{background:#eee;color:#777}
@media(max-width:900px){.entry{grid-template-columns:1fr}.intro{text-align:center}.features{justify-content:center}.teacher-grid,.admin-grid{grid-template-columns:1fr}.side{min-height:600px}}@media(max-width:580px){header{height:68px;padding:0 16px}.chip.school{display:none}.entry{padding:24px 0}.intro h1{font-size:43px}.features{display:none}.card{padding:18px}.two,.form-row,.toolbar{grid-template-columns:1fr}.control{padding:20px 15px}.stage{height:285px}.actions{grid-template-columns:1fr 1fr}.actions .open{grid-column:1/3}.side{padding:16px}.join-card strong{font-size:29px}.qr{width:92px;height:92px}}
</style></head><body>
<div id="setup" class="setup hidden"><div class="setup-box"><h2>首次設定後端網址</h2><p>貼上 Google Apps Script 部署後的「網頁應用程式網址」（必須以 /exec 結尾）。正式上傳 GitHub 前，也可直接修改程式中的 DEFAULT_GAS_URL。</p><input id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec"><button class="primary" onclick="saveGasUrl()">儲存並開始使用</button></div></div>
<div id="app"></div>
<script src="admin.js"></script>
<script>
const DEFAULT_GAS_URL='https://script.google.com/macros/s/AKfycbw9mp8qRLQKxl19LC-a8pmoE9aUEjjm7OLulqQm1-LO6zlf5KJlgZbaQa1V-Sb-mNMn/exec';
const app=document.getElementById('app'),state={game:null,timer:null,pressed:false,questions:[],editing:null},qs=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const gasUrl=()=>localStorage.getItem('xingjiaGasUrl')||DEFAULT_GAS_URL;
function saveGasUrl(){const v=document.getElementById('gasUrlInput').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v))return alert('請貼上正確的 Apps Script /exec 網址');localStorage.setItem('xingjiaGasUrl',v);document.getElementById('setup').classList.add('hidden');render()}
async function api(payload){const r=await fetch(gasUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'}),d=await r.json();if(!d.ok)throw new Error(d.error||'操作失敗');return d}
const brand=()=>'<div class="brand"><span class="brand-mark">🔔</span><div><strong>興嘉課堂搶答器</strong><small>SING CHIA QUIZ BUZZ</small></div></div>';
function stop(){if(state.timer)clearInterval(state.timer);state.timer=null}
function render(){stop();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(gasUrl()))document.getElementById('setup').classList.remove('hidden');const mode=qs.get('mode'),code=qs.get('code')||'';if(mode==='admin')admin();else if(mode==='teacher'&&/^\d{6}$/.test(code))teacher(code);else if(mode==='student'&&/^\d{6}$/.test(code))student(code);else landing(mode==='join'?code:'')}
function landing(preset=''){let tab=preset?'student':'teacher';app.innerHTML='<main class="landing"><header>'+brand()+'<span class="chip school">嘉義市興嘉國民小學</span></header><section class="entry"><div class="intro"><span class="eyebrow">READY · SET · BUZZ!</span><h1>讓每一次舉手，<br><em>都被看見。</em></h1><p>不用安裝 App。教師開啟房間，學生輸入代碼即可加入；最快搶答、即時計分、全班排行一次完成。</p><div class="features"><span>👥 全班即時加入</span><span>🏆 自動排行榜</span><span>📊 成績可匯出</span></div></div><div class="card"><div class="tabs"><button id="tt">🎓 我是老師</button><button id="ts">↪ 我是學生</button></div><div id="form"></div></div></section><footer>興嘉—學習的家 · 讓科技成為每個孩子參與學習的橋梁</footer></main>';
const draw=()=>{tt.className=tab==='teacher'?'active':'';ts.className=tab==='student'?'active':'';form.innerHTML=tab==='teacher'?'<div class="card-title"><h2>教師登入</h2><p>登入後可建立房間與管理題庫</p></div><label>全校共用教師密碼<input id="password" type="password" autocomplete="current-password" placeholder="請輸入教師密碼"></label><button class="primary" id="submit">教師登入 →</button><p id="err"></p><p class="privacy">🔒 密碼由 Apps Script 安全驗證</p>':'<div class="card-title"><h2>加入搶答</h2><p>請依序填寫資料</p></div><label>房間代碼<input id="code" class="code-input" inputmode="numeric" maxlength="6" value="'+esc(preset)+'" placeholder="000000"></label><div class="two"><label>班級<input id="className" placeholder="例如：307"></label><label>姓名<input id="name" placeholder="請輸入姓名"></label></div><button class="primary orange" id="submit">加入房間 →</button><p id="err"></p><p class="privacy">🔒 僅用於課堂活動</p>';submit.onclick=go};async function go(){submit.disabled=true;err.textContent='';try{if(tab==='teacher'){const d=await api({action:'teacherLogin',password:password.value});sessionStorage.setItem('teacherSession',d.sessionToken);location.href='?mode=admin'}else{const c=code.value.replace(/\D/g,'').slice(0,6),n=name.value.trim();if(c.length!==6||!n)throw new Error('請填寫房間代碼與姓名');const d=await api({action:'join',code:c,name:n,className:className.value});localStorage.setItem('participant:'+d.code,d.participantToken);localStorage.setItem('participantName:'+d.code,n);location.href='?mode=student&code='+d.code}}catch(e){err.className='error';err.textContent=e.message;submit.disabled=false}}tt.onclick=()=>{tab='teacher';preset='';draw()};ts.onclick=()=>{tab='student';draw()};draw()}
async function teacher(code){const token=localStorage.getItem('teacher:'+code)||'';app.innerHTML='<main class="teacher"><header>'+brand()+'<span id="live" class="live">載入中</span></header><div class="teacher-grid"><section class="control"><div class="room-head"><div><span id="round">教師控制台</span><h1 id="title">正在載入…</h1></div><button class="ghost" onclick="csv()">⬇ 匯出</button></div><div id="stage" class="stage"><div class="icon">🔔</div><h2>準備中</h2></div><div class="actions"><button id="openBtn" class="open" onclick="act(\'open\')">▶ 開始第一回合</button><button id="lockBtn" class="lock" onclick="act(\'lock\')">🔒 鎖定</button><button id="waitBtn" class="wait" onclick="act(\'waiting\')">↻ 等待</button></div><div id="score"></div><p id="err"></p></section><aside class="side"><div class="join-card"><div><span>房間代碼</span><strong>'+code+'</strong><button onclick="copyJoin()">複製加入連結</button></div><div id="qr" class="qr"></div></div><div class="rank-title"><h2>🏆 即時排行榜</h2><p id="count">0 位學生</p></div><div id="ranking" class="ranking"><div class="empty">等待學生加入</div></div><button class="end" onclick="act(\'end\')">結束本場活動</button></aside></div></main>';if(!token){err.className='error';err.textContent='這個裝置沒有教師控制權';return}new QRCode(qr,{text:new URL('?mode=join&code='+code,location.href).href,width:92,height:92,colorDark:'#123e52'});async function load(){try{state.game=await api({action:'status',code,teacherToken:token});paintTeacher()}catch(e){err.className='error';err.textContent=e.message}}window.act=async(action,extra={})=>{try{state.game=await api({action,code,teacherToken:token,...extra});paintTeacher()}catch(e){alert(e.message)}};window.copyJoin=()=>navigator.clipboard.writeText(new URL('?mode=join&code='+code,location.href).href).then(()=>alert('已複製'));load();state.timer=setInterval(load,1200)}
function paintTeacher(){const g=state.game,status={open:'搶答開放中',locked:'本回合已鎖定',ended:'活動已結束',waiting:'等待老師開始'}[g.room.status];live.className='live '+g.room.status;live.textContent=status;round.textContent='教師控制台 · 第 '+g.room.round+' 回合';title.textContent=g.room.title;stage.className='stage '+(g.winner?'winner':'');stage.innerHTML=g.winner?'<div class="icon">🏆</div><h2>'+esc((g.winner.className?g.winner.className+' · ':'')+g.winner.name)+'</h2><p>第 '+g.winner.round+' 回合最快搶答</p>':'<div class="icon">🔔</div><h2>'+(g.room.status==='open'?'搶答中！':'準備下一回合')+'</h2><p>'+(g.room.status==='open'?'等待最快按下搶答鈴的學生':'點擊按鈕開放全班搶答')+'</p>';openBtn.disabled=g.room.status==='open'||g.room.status==='ended';openBtn.textContent=g.room.round?'▶ 開放下一回合':'▶ 開始第一回合';lockBtn.disabled=g.room.status!=='open';waitBtn.disabled=g.room.status==='ended';score.innerHTML=g.winner?'<div class="scorebar"><span>本回合得分</span><button onclick="act(\'score\',{participantId:\''+g.winner.id+'\',delta:-1})">−1</button><button class="award" onclick="act(\'score\',{participantId:\''+g.winner.id+'\',delta:1})">＋1 分</button></div>':'';count.textContent=g.participants.length+' 位學生已加入';ranking.innerHTML=g.participants.length?g.participants.map((p,i)=>'<div class="rank"><b>'+(i+1)+'</b><span><strong>'+esc(p.name)+'</strong><small>'+esc(p.className||'未填班級')+'</small></span><em>'+p.score+' 分</em><div class="mini"><button onclick="act(\'score\',{participantId:\''+p.id+'\',delta:-1})">−</button><button onclick="act(\'score\',{participantId:\''+p.id+'\',delta:1})">＋</button><button onclick="act(\'remove\',{participantId:\''+p.id+'\'})">×</button></div></div>').join(''):'<div class="empty">👥<br>等待學生加入</div>'}
function csv(){if(!state.game)return;const rows=[['名次','班級','姓名','分數'],...state.game.participants.map((p,i)=>[i+1,p.className,p.name,p.score])],data='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='興嘉搶答_'+state.game.room.code+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function student(code){const token=localStorage.getItem('participant:'+code)||'',name=localStorage.getItem('participantName:'+code)||'同學';if(!token){landing(code);return}app.innerHTML='<main id="student" class="student"><header>'+brand()+'<span class="chip">房間 '+code+'</span></header><section class="student-stage"><div class="student-meta"><span id="sTitle">課堂搶答</span><strong>嗨，'+esc(name)+'！</strong><small id="sRound">準備中</small></div><button id="buzzer" class="buzzer" onclick="buzz()"><span class="ring"><span class="face"><i>🔔</i><b id="buzzText">等待</b><small id="buzzSmall">WAIT</small></span></span></button><div id="message" class="message"><strong>正在連線</strong>請稍候</div></section></main>';async function load(){try{state.game=await api({action:'status',code});paintStudent(name)}catch(e){message.innerHTML='<strong>連線失敗</strong>'+esc(e.message)}}window.buzz=async()=>{if(!state.game||state.game.room.status!=='open'||state.pressed)return;state.pressed=true;navigator.vibrate?.(80);paintStudent(name);try{await api({action:'buzz',code,participantToken:token});await load()}catch(e){message.innerHTML='<strong>'+esc(e.message)+'</strong>';await load()}};load();state.timer=setInterval(load,850)}
function paintStudent(name){const g=state.game,open=g.room.status==='open'&&!g.winner,mine=g.winner&&g.winner.name===name;if(!open)state.pressed=false;student.className='student '+(open?'ready':'');sTitle.textContent=g.room.title;sRound.textContent='第 '+g.room.round+' 回合';buzzer.className='buzzer '+(open?'ready ':'')+(state.pressed?'pressed':'');buzzer.disabled=!open||state.pressed;buzzText.textContent=open?(state.pressed?'已送出':'搶答！'):'等待';buzzSmall.textContent=open?'BUZZ NOW':'WAIT';message.className='message '+(mine?'winner':'');message.innerHTML=mine?'<strong>🏆 就是你！</strong>請準備回答老師的問題':g.winner?'<strong>'+esc(g.winner.name)+' 搶到囉！</strong>聽聽看同學怎麼回答':open?'<strong>搶答已開放</strong>看準時機，按下搶答鈴！':'<strong>等待老師開放搶答</strong>按鈕亮起後就能搶答'}
render();
</script></body></html>
